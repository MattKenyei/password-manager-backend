root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main.exe ./cmd/server"
  bin = "./tmp/main.exe"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", ".git", "migrations"]
  delay = 1000
  stop_on_error = true

[build.env]
  E2E_MODE = "1"

[log]
  time = false

[misc]
  clean_on_exit = true